name: job-manager-project

services:
  client:
    build: client
    environment:
      API_PROXY_TARGET: http://api-gateway:${API_PORT:-3000}
    ports:
      - "8080:4173"
    networks:
      - job-manager-project

  api-gateway:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        APP: api-gateway
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      job-server:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      PORT: ${API_PORT:-3000}
      JOB_HOST: job-server
      JOB_PORT: ${JOB_PORT:-3001}
      AUTH_HOST: auth
      AUTH_PORT: ${AUTH_PORT:-3002}
    healthcheck:
      test: [ "CMD", "wget", "--spider", "--timeout=3", "http://127.0.0.1:${API_PORT:-3000}/health" ]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    networks:
      - job-manager-project

  auth:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        APP: auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${AUTH_PORT:-3002}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      CLIENT_URL: http://localhost:8080
    healthcheck:
      test: [ "CMD", "wget", "--spider", "--timeout=3", "http://127.0.0.1:${AUTH_PORT:-3002}/health" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - job-manager-project

  job-server:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        APP: job
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis-bullmq:
        condition: service_healthy
    environment:
      PORT: ${JOB_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_HOST: redis-bullmq
      REDIS_PORT: 6379
    healthcheck:
      test: [ "CMD", "nc", "-z", "127.0.0.1", "${JOB_PORT:-3001}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - job-manager-project

  job-worker:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        APP: job-worker
    restart: unless-stopped
    deploy:
      replicas: 3
    depends_on:
      redis-bullmq:
        condition: service_healthy
    environment:
      JOB_HOST: job-server
      JOB_PORT: ${JOB_PORT:-3001}
      REDIS_HOST: redis-bullmq
      REDIS_PORT: 6379
    networks:
      - job-manager-project

  job-scheduler:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        APP: job-scheduler
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis-bullmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_HOST: redis-bullmq
      REDIS_PORT: 6379
    networks:
      - job-manager-project

  db:
    image: postgres:alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPORT: ${POSTGRES_PORT}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - job-manager-project

  redis-bullmq:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - job-manager-project

volumes:
  pgdata:
  redis_data:

networks:
  job-manager-project:
