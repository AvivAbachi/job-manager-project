name: job-manager-project

services:
  client:
    build: client
    environment:
      API_PROXY_TARGET: http://api-gateway:${API_PORT:-3000}
    ports:
      - "8080:4173"
    networks:
      - job-manager-project

  api-gateway:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        APP: api-gateway
    restart: unless-stopped
    depends_on:
      job-server:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      PORT: ${API_PORT:-3000}
      JOB_HOST: job-server
      JOB_PORT: ${JOB_PORT:-3001}
      AUTH_HOST: auth
      AUTH_PORT: ${AUTH_PORT:-3002}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--timeout=3",
          "http://127.0.0.1:${API_PORT:-3000}/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    networks:
      - job-manager-project

  auth:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        APP: auth
    restart: unless-stopped
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      db-auth:
        condition: service_healthy
    environment:
      PORT: ${AUTH_PORT:-3002}
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-auth:${AUTH_POSTGRES_PORT:-5433}/${AUTH_POSTGRES_DB:-job_manager_auth}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      REDIS_AUTH_HOST: redis-auth
      REDIS_AUTH_PORT: 6378
      CLIENT_URL: http://localhost:8080
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--timeout=3",
          "http://127.0.0.1:${AUTH_PORT:-3002}/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - job-manager-project

  auth-migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: build
    command: pnpm exec prisma migrate deploy --config libs/contracts/prisma/auth.prisma.config.ts
    depends_on:
      db-auth:
        condition: service_healthy
    environment:
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-auth:${AUTH_POSTGRES_PORT:-5433}/${AUTH_POSTGRES_DB:-job_manager_auth}
    networks:
      - job-manager-project

  jobs-migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: build
    command: pnpm exec prisma migrate deploy --config libs/contracts/prisma/jobs.prisma.config.ts
    depends_on:
      db-jobs:
        condition: service_healthy
    environment:
      JOBS_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-jobs:${JOBS_POSTGRES_PORT:-5432}/${JOBS_POSTGRES_DB:-job_manager_jobs}
    networks:
      - job-manager-project

  job-server:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        APP: job
    restart: unless-stopped
    depends_on:
      jobs-migrate:
        condition: service_completed_successfully
      db-jobs:
        condition: service_healthy
      redis-bullmq:
        condition: service_healthy
    environment:
      PORT: ${JOB_PORT:-3001}
      JOBS_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-jobs:${JOBS_POSTGRES_PORT:-5432}/${JOBS_POSTGRES_DB:-job_manager_jobs}
      REDIS_BULLMQ_HOST: redis-bullmq
      REDIS_BULLMQ_PORT: 6379
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "${JOB_PORT:-3001}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - job-manager-project

  job-worker:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        APP: job-worker
    restart: unless-stopped
    deploy:
      replicas: 3
    depends_on:
      jobs-migrate:
        condition: service_completed_successfully
      db-jobs:
        condition: service_healthy
      redis-bullmq:
        condition: service_healthy
    environment:
      JOB_HOST: job-server
      JOB_PORT: ${JOB_PORT:-3001}
      JOBS_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-jobs:${JOBS_POSTGRES_PORT:-5432}/${JOBS_POSTGRES_DB:-job_manager_jobs}
      REDIS_BULLMQ_HOST: redis-bullmq
      REDIS_BULLMQ_PORT: 6379
    networks:
      - job-manager-project

  job-scheduler:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        APP: job-scheduler
    restart: unless-stopped
    depends_on:
      jobs-migrate:
        condition: service_completed_successfully
      db-jobs:
        condition: service_healthy
      redis-bullmq:
        condition: service_healthy
    environment:
      JOBS_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-jobs:${JOBS_POSTGRES_PORT:-5432}/${JOBS_POSTGRES_DB:-job_manager_jobs}
      REDIS_BULLMQ_HOST: redis-bullmq
      REDIS_BULLMQ_PORT: 6379
    networks:
      - job-manager-project

  db-jobs:
    image: postgres:alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${JOBS_POSTGRES_DB:-job_manager_jobs}
      PGPORT: ${JOBS_POSTGRES_PORT:-5432}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${JOBS_POSTGRES_DB:-job_manager_jobs} -p ${JOBS_POSTGRES_PORT:-5432}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${JOBS_POSTGRES_PORT:-5432}:${JOBS_POSTGRES_PORT:-5432}"
    volumes:
      - db-jobs:/var/lib/postgresql
    networks:
      - job-manager-project

  redis-bullmq:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - redis_bullmq:/data
    networks:
      - job-manager-project

  db-auth:
    image: postgres:alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_POSTGRES_DB:-job_manager_auth}
      PGPORT: ${AUTH_POSTGRES_PORT:-5433}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${AUTH_POSTGRES_DB:-job_manager_auth} -p ${AUTH_POSTGRES_PORT:-5433}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${AUTH_POSTGRES_PORT:-5433}:${AUTH_POSTGRES_PORT:-5433}"
    volumes:
      - db-auth:/var/lib/postgresql
    networks:
      - job-manager-project

  redis-auth:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --port 6378
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6378", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6378:6378"
    volumes:
      - redis_data:/data
    networks:
      - job-manager-project

volumes:
  db-jobs:
  db-auth:
  redis_bullmq:
  redis_data:

networks:
  job-manager-project:
